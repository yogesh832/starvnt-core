services:
  # ----------------------------------------------------------------------------
  # StarVnt Core Backend Server (Node.js Express + Mongoose)
  # ----------------------------------------------------------------------------
  starvnt-server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: starvnt-server
    restart: always
    env_file:
      - ./server.env
    environment:
      - NODE_ENV=production
      - PORT=4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # StarVnt Unified Web Frontend (Admin, Vendor, Customer SPAs)
  # ----------------------------------------------------------------------------
  starvnt-web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    container_name: starvnt-web
    restart: always
    expose:
      - "80"

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy with Let's Encrypt SSL & Subdomain Routing
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: starvnt-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/starvnt.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    volumes_from:
      - starvnt-web:ro
    depends_on:
      - starvnt-server
      - starvnt-web
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Automated SSL Certificate Manager (Certbot)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v3.1.0
    container_name: starvnt-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot_etc:
  certbot_var:
  certbot_www:
