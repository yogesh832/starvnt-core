# ==============================================================================
# STARVNT - Production Nginx Reverse Proxy & Subdomain Router
# ==============================================================================

# Rate limiting zones to protect auth & AI endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Upstream Backend API
upstream starvnt_backend {
    server starvnt-server:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name starvnt.com www.starvnt.com admin.starvnt.com vendor.starvnt.com partner.starvnt.com api.starvnt.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Backend API Domain: api.starvnt.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.starvnt.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/starvnt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starvnt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Max upload size for vendor portfolios and KYC documents
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint
    location /api/health {
        proxy_pass http://starvnt_backend/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Strict rate limit on authentication endpoints
    location ~* ^/api/(external|admin)/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://starvnt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aura+ AI streaming & general API proxying
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://starvnt_backend;
        proxy_http_version 1.1;
        
        # Vital for Server-Sent Events (SSE) & Aura+ streaming:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. Frontend Unified Web Portal (starvnt.com, admin.*, vendor.*)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starvnt.com www.starvnt.com admin.starvnt.com vendor.starvnt.com partner.starvnt.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/starvnt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starvnt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static Assets with 1-year Immutable Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Brand assets / icons
    location /brand/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Direct /api calls to backend if not using api.starvnt.com
    location /api/ {
        proxy_pass http://starvnt_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Client-Side Routing: rewrite all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
