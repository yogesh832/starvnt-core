apiVersion: apps/v1
kind: Deployment
metadata:
  name: starvnt-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: starvnt-web
  template:
    metadata:
      labels:
        app: starvnt-web
    spec:
      containers:
        - name: web
          image: starvnt/web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: starvnt-web
spec:
  selector:
    app: starvnt-web
  ports:
    - port: 80
      targetPort: 80
