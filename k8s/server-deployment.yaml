apiVersion: apps/v1
kind: Deployment
metadata:
  name: starvnt-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: starvnt-server
  template:
    metadata:
      labels:
        app: starvnt-server
    spec:
      containers:
        - name: server
          image: starvnt/server:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: starvnt-server-secrets
            - configMapRef:
                name: starvnt-server-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: starvnt-server
spec:
  selector:
    app: starvnt-server
  ports:
    - port: 4000
      targetPort: 4000
