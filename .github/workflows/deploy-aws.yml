name: Test and deploy main to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Backend tests (isolated local MongoDB)
        run: npm test
      - name: Frontend production build
        run: npm run build -w web
      - name: Build production container images
        run: |
          docker build --tag starvnt-backend:ci --file deploy/aws/Dockerfile.backend .
          docker build --tag starvnt-web:ci --build-arg DEPLOY_SHA=ci --file deploy/aws/Dockerfile.web .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_PAGER: ''
      INSTANCE_ID: i-050ba337d9d81dd2c
    steps:
      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::089366939966:role/starvnt-github-main-deploy
          aws-region: ap-south-1
          role-session-name: github-${{ github.run_id }}
          role-duration-seconds: 1800
          allowed-account-ids: '089366939966'
      - name: Deploy the tested commit through Systems Manager
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name StarvntDeployMain \
            --parameters "CommitSha=$DEPLOY_SHA" \
            --comment "Deploy main $DEPLOY_SHA (GitHub run $GITHUB_RUN_ID)" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          status=Pending
          for attempt in $(seq 1 140); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 8
          done
          aws ssm get-command-invocation --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          [[ "$status" == Success ]]
      - name: Verify public services and deployed revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 https://app.starvnt.com/api/health
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 https://vendor.starvnt.com/
          actual=$(curl --fail --silent https://vendor.starvnt.com/deployment.json | jq -r .commit)
          [[ "$actual" == "$DEPLOY_SHA" ]]
          curl --fail --silent https://app.starvnt.com/privacy-policy | grep -q '<div id="root">'
          echo "### Deployed $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Backend health, frontend, privacy route and revision checks passed.' >> "$GITHUB_STEP_SUMMARY"
