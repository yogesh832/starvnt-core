services:
  mongo-test:
    image: mongo:7
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - starvnt_test_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  starvnt_test_mongo:
